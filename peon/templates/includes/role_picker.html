<div class="role-picker role-picker">
  <div class="role-picker-head role-picker-head">
    <span class="role-picker-title role-picker-title">Roles</span>
    <span class="meta role-picker-hint role-picker-hint">{{ hint|default:"Core crew roles stay on; add specialists for the planner" }}</span>
  </div>
  <div class="role-picker-grid role-picker-grid">
    {% for role in available_roles %}
    {% if role.required %}
    <input type="hidden" name="role_ids" value="{{ role.name }}">
    {% endif %}
    <label class="role-chip role-chip{% if role.required %} role-chip-required role-chip-required{% endif %}">
      <input type="checkbox" {% if not role.required %}name="role_ids" value="{{ role.name }}"{% endif %}
        {% if role.required or role.name in selected_roles %}checked{% endif %}
        {% if role.required %}disabled aria-disabled="true"{% endif %}>
      <span class="role-chip-face role-chip-face" title="{{ role.description }}{% if role.required %} (always included){% endif %}">
        <span class="role-chip-name role-chip-name">{{ role.name }}</span>
        {% if role.required %}<span class="role-chip-lock role-chip-lock">Required</span>{% endif %}
        {% if role.category %}<span class="role-chip-cat role-chip-cat">{{ role.category }}</span>{% endif %}
        {% if role.description %}<span class="role-chip-desc role-chip-desc">{{ role.description }}</span>{% endif %}
        {% if role.tags %}
        <span class="role-card-tags catalog-card-tags">
          {% for t in role.tags %}<span class="chip">{{ t }}</span>{% endfor %}
        </span>
        {% endif %}
      </span>
    </label>
    {% empty %}
    <p class="meta">No roles in the catalog (roles/).</p>
    {% endfor %}
  </div>
</div>
