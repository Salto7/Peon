{% load ui %}
<fieldset class="space-y-3">
  <legend class="ui-label">Roles</legend>
  <p class="ui-help -mt-1">{{ hint|default:"Core crew roles stay on; add specialists for the planner." }}</p>
  <div class="grid gap-2 sm:grid-cols-2">
    {% for role in available_roles %}
    {% if role.required %}<input type="hidden" name="role_ids" value="{{ role.name }}">{% endif %}
    <label class="group flex cursor-pointer gap-3 rounded-lg border p-3 transition-colors hover:bg-accent/50 has-[:checked]:border-primary/50 has-[:checked]:bg-primary/5 has-[:disabled]:cursor-default has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-ring">
      <input type="checkbox" class="ui-checkbox mt-0.5 focus-visible:outline-none" {% if not role.required %}name="role_ids" value="{{ role.name }}"{% endif %}
        {% if role.required or role.name in selected_roles %}checked{% endif %}
        {% if role.required %}disabled{% endif %}>
      <span class="min-w-0 flex-1 space-y-1">
        <span class="flex flex-wrap items-center gap-1.5">
          <span class="font-mono text-[13px] font-medium">{{ role.name }}</span>
          {% if role.required %}<c-badge>Required</c-badge>{% endif %}
          {% if role.category %}<span class="text-xs text-muted-foreground">{{ role.category }}</span>{% endif %}
        </span>
        {% if role.description %}<span class="line-clamp-2 block text-xs text-muted-foreground">{{ role.description }}</span>{% endif %}
      </span>
    </label>
    {% empty %}
    <p class="text-sm text-muted-foreground">No roles in the platform catalog.</p>
    {% endfor %}
  </div>
</fieldset>
