# Peon — Compose stack. Images/entrypoints live under Docker/.
#
# From repo root:
#   docker compose up -d --build
#
# Browser: https://localhost:${WEB_PORT:-8000}/  (self-signed cert via edge)

name: peon

services:
  # Kali-based image for Docker sandbox + OpenShell. Built with the stack so
  # `docker compose up --build` picks up Dockerfile changes (uv/uvx, MCP client).
  # Not a long-running service — exits immediately after create.
  sandbox:
    build:
      context: .
      dockerfile: Docker/sandbox/Dockerfile
    image: peon-sandbox:local
    entrypoint: ["/bin/true"]
    restart: "no"

  # The lab only (Toolsmith install tests + OpenCode authoring) —
  # peon-sandbox:local plus a pinned OpenCode CLI
  # baked in at build time (no network fetch at authoring time). Never used
  # for engagement project sandboxes or OpenShell.
  sandbox-lab:
    build:
      context: .
      dockerfile: Docker/sandbox-lab/Dockerfile
    image: peon-sandbox-lab:local
    depends_on:
      - sandbox
    entrypoint: ["/bin/true"]
    restart: "no"

  # Message broker for Dramatiq — queues long-running job actors for the worker.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Django app (control plane + operator UI). Listens on HTTP :8000 inside the network only.
  web:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    image: peon-web:local
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: peon.config.settings
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,edge}
      PROJECT_WORKSPACES_DIR: /workspaces
      # Host root is mounted below; the app sees configured child paths.
      SKILLS_EXTRA_DIRS: ${SKILLS_EXTRA_CONTAINER_DIRS:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost:8000,https://127.0.0.1:8000}
      STREAM_SOCKET_PATH: /tmp/peon/stream.sock
      # Must match the worker: both processes derive the sandbox fingerprint
      # from it, and a mismatch makes each recreate the other's container.
      SANDBOX_SOCKETS_VOLUME: ${SANDBOX_SOCKETS_VOLUME:-peon_sockets}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-peon-sandbox:local}
      OPENSHELL_IMAGE: ${OPENSHELL_IMAGE:-peon-sandbox:local}
      PROJECT_SANDBOX_PREFIX: ${PROJECT_SANDBOX_PREFIX:-peon-project}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DRAMATIQ_ENABLED: ${DRAMATIQ_ENABLED:-true}
      COGNEE_ENABLED: ${COGNEE_ENABLED:-true}
      COGNEE_PORT: ${COGNEE_PORT:-8001}
      PEON_DREAMING_ENABLED: ${PEON_DREAMING_ENABLED:-true}
      PEON_DREAMING_INTERVAL_S: ${PEON_DREAMING_INTERVAL_S:-900}
    volumes:
      - peon_workspaces:/workspaces
      - peon_sockets:/tmp/peon
      # Lab create/test/delete (AJAX). Project sandbox cleanup stays on worker.
      - /var/run/docker.sock:/var/run/docker.sock
      # Live-edit UI / control plane without rebuild (uvicorn --reload).
      - ./peon:/app/peon
      - ./orchestrator:/app/orchestrator
      - ./agent_runtime:/app/agent_runtime
      - ./manage.py:/app/manage.py
      - ./skills:/app/skills
      - ./mcps:/app/mcps
      - ./skills_imported:/app/skills_imported
      - ${SKILLS_EXTRA_HOST_ROOT:-./skills_imported}:/external-skills:ro
      - ./tools:/app/tools
    # Dev: auto-reload on code edits and on `npm run dev` rebuilds (manifest.json).
    command:
      - uvicorn
      - peon.config.asgi:application
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --reload
      - --reload-dir=/app/peon
      - --reload-dir=/app/orchestrator
      - --reload-dir=/app/agent_runtime
      - --reload-include=manifest.json
      - --lifespan=off
      # Open SSE streams would otherwise stall a reload/stop indefinitely.
      - --timeout-graceful-shutdown=3
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      cognee:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Background runner: Dramatiq consumers + Unix stream socket; starts project sandboxes via docker.sock.
  worker:
    image: peon-web:local
    build:
      context: .
      dockerfile: Docker/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: peon.config.settings
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,edge}
      PROJECT_WORKSPACES_DIR: /workspaces
      # Must match child paths below the read-only external-root mount.
      SKILLS_EXTRA_DIRS: ${SKILLS_EXTRA_CONTAINER_DIRS:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8000}
      STREAM_SOCKET_PATH: /tmp/peon/stream.sock
      ORCHESTRATOR_STREAM_SOCKET: /tmp/peon/stream.sock
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-peon-sandbox:local}
      OPENSHELL_IMAGE: ${OPENSHELL_IMAGE:-peon-sandbox:local}
      PROJECT_SANDBOX_PREFIX: ${PROJECT_SANDBOX_PREFIX:-peon-project}
      SANDBOX_SOCKETS_VOLUME: ${SANDBOX_SOCKETS_VOLUME:-peon_sockets}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DRAMATIQ_ENABLED: ${DRAMATIQ_ENABLED:-true}
      DRAMATIQ_TIME_LIMIT_MS: ${DRAMATIQ_TIME_LIMIT_MS:-21600000}
      COGNEE_ENABLED: ${COGNEE_ENABLED:-true}
      COGNEE_PORT: ${COGNEE_PORT:-8001}
      PEON_DREAMING_ENABLED: ${PEON_DREAMING_ENABLED:-true}
      PEON_DREAMING_INTERVAL_S: ${PEON_DREAMING_INTERVAL_S:-900}
    volumes:
      - peon_workspaces:/workspaces
      - peon_sockets:/tmp/peon
      - ./peon:/app/peon
      - ./orchestrator:/app/orchestrator
      - ./agent_runtime:/app/agent_runtime
      - ./manage.py:/app/manage.py
      - ./skills:/app/skills
      - ./mcps:/app/mcps
      - ./skills_imported:/app/skills_imported
      - ${SKILLS_EXTRA_HOST_ROOT:-./skills_imported}:/external-skills:ro
      - ./tools:/app/tools
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/entrypoint-worker.sh"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
      cognee:
        condition: service_started
    restart: unless-stopped

  # HTTPS edge / reverse proxy (Caddy): only host-facing service. Terminates TLS and
  # forwards to web:8000. "Edge" = the network edge between the internet/host and the app.
  edge:
    build:
      context: ./Docker/edge
    image: peon-edge:local
    ports:
      - "${WEB_PORT:-8000}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - edge_certs:/certs
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Optional OpenAI-compatible LiteLLM proxy (OpenCode / Lab). Off by default.
  # Prefer: LLM_PROXY_ENABLED in Peon Settings (web starts peon-litellm).
  # Or: COMPOSE_PROFILES=llm-proxy. Peon agents + Cognee do not need this proxy.
  # Single model from LITELLM_MODEL — config is generated here (no Docker/litellm/*.yaml).
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["llm-proxy"]
    env_file:
      - .env
    environment:
      LITELLM_MODEL: ${LITELLM_MODEL:-openrouter/openai/gpt-5.6-luna}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-peon-litellm}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        MODEL="$${LITELLM_MODEL:?LITELLM_MODEL required}"
        cat >/tmp/config.yaml <<EOF
        model_list:
          - model_name: default
            litellm_params:
              model: os.environ/LITELLM_MODEL
              api_key: os.environ/OPENROUTER_API_KEY
          - model_name: "$${MODEL}"
            litellm_params:
              model: os.environ/LITELLM_MODEL
              api_key: os.environ/OPENROUTER_API_KEY
          - model_name: openrouter/openai/text-embedding-3-small
            litellm_params:
              model: openrouter/openai/text-embedding-3-small
              api_key: os.environ/OPENROUTER_API_KEY
        general_settings:
          master_key: os.environ/LITELLM_MASTER_KEY
        EOF
        exec litellm --config /tmp/config.yaml --host 0.0.0.0 --port 4000
    ports:
      - "${LLM_PROXY_PORT:-4000}:4000"
    networks:
      default:
        aliases:
          - litellm
    restart: unless-stopped

  # Self-hosted Cognee memory sidecar (single writer). Peon → http://cognee:<port>.
  # Chat LLM = LITELLM_MODEL via OpenRouter (Cognee embeds LiteLLM; no Peon proxy).
  # Embeddings are separate (required by cognify) — OpenRouter text-embedding-3-small.
  cognee:
    image: ${COGNEE_IMAGE:-cognee/cognee:main}
    restart: unless-stopped
    environment:
      HTTP_PORT: ${COGNEE_PORT:-8001}
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      COGNEE_SKIP_CONNECTION_TEST: ${COGNEE_SKIP_CONNECTION_TEST:-true}
      LLM_PROVIDER: custom
      LLM_MODEL: ${LITELLM_MODEL:-openrouter/openai/gpt-5.6-luna}
      LLM_API_KEY: ${OPENROUTER_API_KEY}
      EMBEDDING_PROVIDER: custom
      EMBEDDING_MODEL: ${COGNEE_EMBEDDING_MODEL:-openrouter/openai/text-embedding-3-small}
      EMBEDDING_API_KEY: ${OPENROUTER_API_KEY}
      EMBEDDING_DIMENSIONS: ${COGNEE_EMBEDDING_DIMENSIONS:-1536}
    volumes:
      - peon_cognee:/cognee-storage
    expose:
      - "${COGNEE_PORT:-8001}"
    ports:
      - "${COGNEE_PORT:-8001}:${COGNEE_PORT:-8001}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${HTTP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      default:
        aliases:
          - cognee

volumes:
  peon_workspaces:
    name: peon_workspaces
  edge_certs:
    name: peon_edge_certs
  peon_sockets:
    name: peon_sockets
  peon_cognee:
    name: peon_cognee
