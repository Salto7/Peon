# Peon — Compose stack. Images/entrypoints live under Docker/.
#
# From repo root:
#   docker compose up -d --build
#
# Browser: https://localhost:${WEB_PORT:-8000}/  (self-signed cert via edge)

name: peon

services:
  # Build-only profile: Kali-based image for Docker sandbox + OpenShell (not long-running).
  #   docker compose --profile build build sandbox
  sandbox:
    build:
      context: .
      dockerfile: Docker/sandbox/Dockerfile
    image: peon-sandbox:local
    profiles: ["build"]

  # Message broker for Dramatiq — queues long-running job actors for the worker.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Django app (control plane + operator UI). Listens on HTTP :8000 inside the network only.
  web:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    image: peon-web:local
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: peon.config.settings
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,edge}
      PEON_DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost:8000,https://127.0.0.1:8000}
      STREAM_SOCKET_PATH: /tmp/peon/stream.sock
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-peon-sandbox:local}
      OPENSHELL_IMAGE: ${OPENSHELL_IMAGE:-peon-sandbox:local}
      PROJECT_SANDBOX_PREFIX: ${PROJECT_SANDBOX_PREFIX:-peon-project}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DRAMATIQ_ENABLED: ${DRAMATIQ_ENABLED:-true}
    volumes:
      - peon_data:/data
      - peon_sockets:/tmp/peon
      # Learn install-lab create/test/delete (AJAX). Project sandbox cleanup stays on worker.
      - /var/run/docker.sock:/var/run/docker.sock
      # Live-edit UI / control plane without rebuild (DEBUG runserver).
      - ./peon:/app/peon
      - ./orchestrator:/app/orchestrator
      - ./agent_runtime:/app/agent_runtime
      - ./manage.py:/app/manage.py
      - ./skills:/app/skills:ro
      - ./tools:/app/tools:ro
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Background runner: Dramatiq consumers + Unix stream socket; starts project sandboxes via docker.sock.
  worker:
    image: peon-web:local
    build:
      context: .
      dockerfile: Docker/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: peon.config.settings
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,edge}
      PEON_DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8000}
      STREAM_SOCKET_PATH: /tmp/peon/stream.sock
      ORCHESTRATOR_STREAM_SOCKET: /tmp/peon/stream.sock
      RPC_SOCKET_PATH: /tmp/peon/rpc.sock
      ORCHESTRATOR_RPC_SOCKET: /tmp/peon/rpc.sock
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-peon-sandbox:local}
      OPENSHELL_IMAGE: ${OPENSHELL_IMAGE:-peon-sandbox:local}
      PROJECT_SANDBOX_PREFIX: ${PROJECT_SANDBOX_PREFIX:-peon-project}
      SANDBOX_SOCKETS_VOLUME: ${SANDBOX_SOCKETS_VOLUME:-peon_sockets}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DRAMATIQ_ENABLED: ${DRAMATIQ_ENABLED:-true}
      DRAMATIQ_TIME_LIMIT_MS: ${DRAMATIQ_TIME_LIMIT_MS:-21600000}
    volumes:
      - peon_data:/data
      - peon_sockets:/tmp/peon
      - ./peon:/app/peon
      - ./orchestrator:/app/orchestrator
      - ./agent_runtime:/app/agent_runtime
      - ./manage.py:/app/manage.py
      - ./skills:/app/skills:ro
      - ./tools:/app/tools:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/entrypoint-worker.sh"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS edge / reverse proxy (Caddy): only host-facing service. Terminates TLS and
  # forwards to web:8000. "Edge" = the network edge between the internet/host and the app.
  edge:
    build:
      context: ./Docker/edge
    image: peon-edge:local
    ports:
      - "${WEB_PORT:-8000}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - edge_certs:/certs
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Optional OpenAI-compatible LiteLLM proxy (off by default).
  # Prefer: enable LLM_PROXY_ENABLED in Peon Settings (web starts peon-litellm).
  # Or: COMPOSE_PROFILES=llm-proxy / docker compose --profile llm-proxy up -d
  # Peon agent traffic stays in-process; gateway is for OpenCode (Toolsmith Learn lab).
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["llm-proxy"]
    env_file:
      - .env
    environment:
      LITELLM_MODEL: ${LITELLM_MODEL:-openrouter/openai/gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      # Bearer key for /v1 clients; default is for local lab only — override in .env.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-peon-litellm}
    volumes:
      - ./Docker/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    ports:
      - "${LLM_PROXY_PORT:-4000}:4000"
    restart: unless-stopped

volumes:
  peon_data:
    name: peon_data
  edge_certs:
    name: peon_edge_certs
  peon_sockets:
    name: peon_sockets
