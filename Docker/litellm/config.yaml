# Minimal LiteLLM proxy config for Peon's optional llm-proxy Compose profile.
# Model and keys come from the process environment (see docker-compose.yml).

model_list:
  - model_name: default
    litellm_params:
      model: os.environ/LITELLM_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
  # Alias matching Peon's default OpenRouter id (OpenCode /clients may use either).
  - model_name: openrouter/openai/gpt-4o-mini
    litellm_params:
      model: os.environ/LITELLM_MODEL
      api_key: os.environ/OPENROUTER_API_KEY

general_settings:
  # Clients (e.g. OpenCode) send this as the Bearer / apiKey to /v1.
  master_key: os.environ/LITELLM_MASTER_KEY
