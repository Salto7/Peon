[project]
name = "corp-osint"
version = "3.0.0"
description = "Passive corporate OSINT entity expansion (CLI + MCP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.9.0",
    "tenacity>=8.2.0",
    "playwright>=1.40.0",
    "mcp>=2.0.0,<3",
]

[project.scripts]
corp-osint = "main:main"
corp-osint-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corp_osint"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"mcp_server.py" = "mcp_server.py"

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
