id: httpx
name: httpx
description: >
  HTTP probing and technology fingerprinting (ProjectDiscovery). Linked skill: http-prober.
  Install recipe and RoE-trusted source_urls are defined in this file.
tier: catalog
binary: httpx
install:
  - type: github_release
    repo: projectdiscovery/httpx
    binary: httpx
    asset_substr: linux_amd64
    source_urls:
      - https://github.com/projectdiscovery/httpx
      - https://api.github.com/repos/projectdiscovery/httpx
      - https://objects.githubusercontent.com
      - https://codeload.github.com
verify:
  - command: "httpx -version"
    # Distinguishes ProjectDiscovery CLI from the Python package console-script.
    must_match: "(?i)current version"
    must_not_match: "httpx\\[cli\\]|required dependencies were not installed"
skills: [http-prober]
tags: [recon, web]
