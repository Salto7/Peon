id: whois
name: whois
description: >
  WHOIS lookups for domains and IP attribution. Linked role: domain-enum.
  Install via apt below.
tier: catalog
binary: whois
install:
  - type: apt
    packages: [whois]
verify:
  - command: "whois --version 2>/dev/null || which whois"
roles: [domain-enum]
tags: [recon, osint]
