<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font: 13px -apple-system, system-ui, sans-serif; width: 320px; padding: 12px; }
  label { display: block; margin-top: 8px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 5px 6px; margin-top: 2px; font-family: monospace; }
  button { margin-top: 12px; width: 100%; padding: 7px; cursor: pointer; }
  #status { margin-top: 10px; font-size: 12px; color: #555; }
  #status.on { color: #1a7f37; font-weight: 600; }
</style>
</head>
<body>
  <label>Server URL</label>
  <input id="serverUrl" placeholder="https://peon.example.com" />
  <label>Project ID</label>
  <input id="projectId" placeholder="00000000-0000-0000-0000-000000000000" />
  <label>Token</label>
  <input id="token" type="password" placeholder="from the project's Settings tab" />
  <button id="save">Save</button>
  <button id="toggle">Start capture on this tab</button>
  <div id="status">Not capturing.</div>
  <script src="popup.js"></script>
</body>
</html>
